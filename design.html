<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Works — Pramil Paudel</title>
  <meta name="description" content="Design and visual work by Pramil Paudel." />
  <link rel="icon" href="favicon.ico" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">

  <!-- Page-specific tweaks -->
  <style>
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 6px 0 14px;
    }
    .filters .chip[aria-pressed="true"] {
      background: linear-gradient(180deg, var(--accent), #094f9f);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(11, 99, 206, .24);
    }
    .tile { outline: none; }
    .tile:focus-visible {
      box-shadow: 0 0 0 3px rgba(11,99,206,.25), 0 10px 26px rgba(16,24,40,.18);
    }
  </style>
</head>

<body>
  <!-- Ambient background -->
  <div class="page-bg" aria-hidden="true"></div>

  <!-- Shared Header -->
  <div id="header"></div>

  <!-- Main Content -->
  <div class="wrap">

    <div class="band">
      <div class="inner">
        <section>
          <div class="card">
            <h2>Gallery</h2>

            <!-- Filter bar -->
            <div class="filters" id="filters">
              <button class="chip" data-filter="all" aria-pressed="true">All</button>
            </div>

            <!-- Gallery grid -->
            <div class="gallery-grid" id="gallery" role="list">
              <a class="tile wide" href="images/design_one.jpg" data-caption="Dashboard concept" data-tags="ui web" role="listitem" tabindex="0">
                <img class="shot" src="images/design_one.jpg" alt="Dashboard concept" loading="lazy">
              </a>

              <a class="tile tall" href="images/design_two.jpg" data-caption="Event poster" data-tags="poster" role="listitem" tabindex="0">
                <img class="shot" src="images/design_two.jpg" alt="Event poster" loading="lazy">
              </a>

              <a class="tile" href="images/design_three.jpg" data-caption="Landing page mock" data-tags="web ui" role="listitem" tabindex="0">
                <img class="shot" src="images/design_three.jpg" alt="Landing page mock" loading="lazy">
              </a>

              <a class="tile wide" href="images/design_four.png" data-caption="Mobile UI — cards" data-tags="ui" role="listitem" tabindex="0">
                <img class="shot" src="images/design_four.png" alt="Mobile UI cards" loading="lazy">
              </a>

              <a class="tile tall" href="images/design_five.jpg" data-caption="Logo / identity exploration" data-tags="identity" role="listitem" tabindex="0">
                <img class="shot" src="images/design_five.jpg" alt="Logo identity exploration" loading="lazy">
              </a>

              <a class="tile" href="images/design_six.jpg" data-caption="Infographic concept" data-tags="poster web" role="listitem" tabindex="0">
                <img class="shot" src="images/design_six.jpg" alt="Infographic concept" loading="lazy">
              </a>

              <a class="tile wide" href="images/design_seven.jpg" data-caption="Hero header artwork" data-tags="web" role="listitem" tabindex="0">
                <img class="shot" src="images/design_seven.jpg" alt="Hero header artwork" loading="lazy">
              </a>
            </div>
          </div>
        </section>
      </div>
    </div>

    <footer>© 2025 Pramil Paudel</footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
      <img class="lb-img" id="lbImg" alt="">
      <button class="lb-btn lb-next" id="lbNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

  <!-- Filters + Lightbox Script -->
  <script>
    (function(){
      const gallery = document.getElementById('gallery');
      const items = Array.from(gallery.querySelectorAll('.tile'));
      const filters = document.getElementById('filters');
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbCaption = document.getElementById('lbCaption');
      const btnPrev = document.getElementById('lbPrev');
      const btnNext = document.getElementById('lbNext');
      const btnClose = document.getElementById('lbClose');
      let visible = items.slice();
      let idx = 0;

      // Filtering
      function setFilter(tag){
        visible = [];
        items.forEach(el => {
          const tags = (el.dataset.tags || '').split(/\s+/);
          const show = (tag === 'all') || tags.includes(tag);
          el.style.display = show ? '' : 'none';
          if (show) visible.push(el);
        });
      }
      filters.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filter]');
        if (!btn) return;
        filters.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed','false'));
        btn.setAttribute('aria-pressed','true');
        setFilter(btn.dataset.filter);
      });

      // Lightbox
      function open(i){
        if (!visible.length) return;
        idx = (i + visible.length) % visible.length;
        const a = visible[idx];
        lbImg.src = a.getAttribute('href');
        lbImg.alt = a.querySelector('.shot')?.alt || '';
        lbCaption.textContent = `${a.dataset.caption || ''}  —  ${idx+1}/${visible.length}`;
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
      }
      function close(){ lb.hidden = true; document.body.style.overflow = ''; lbImg.src = ''; }
      function prev(){ open(idx-1); }
      function next(){ open(idx+1); }

      items.forEach((a, i) => {
        a.addEventListener('click', e => { e.preventDefault(); open(i); });
        a.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
        });
      });
      btnPrev.addEventListener('click', prev);
      btnNext.addEventListener('click', next);
      btnClose.addEventListener('click', close);
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      document.addEventListener('keydown', e => {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      });

      setFilter('all');
    })();
  </script>

  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        const mount = document.getElementById("header");
        mount.innerHTML = html;

        // Scope to the inserted header to avoid collisions
        const header = mount.querySelector('.site-header');
        const toggle = header?.querySelector('.nav-toggle');
        const tabs   = header?.querySelector('#primary-tabs');

        if (!toggle || !tabs) return;

        // Ensure ARIA is present
        toggle.setAttribute('type', 'button');
        toggle.setAttribute('aria-controls', 'primary-tabs');
        toggle.setAttribute('aria-expanded', 'false');

        // Use a single class name that your CSS recognizes
        const openMenu  = () => { tabs.classList.add('open');  toggle.setAttribute('aria-expanded','true');  };
        const closeMenu = () => { tabs.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); };

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = tabs.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(isOpen));
        });

        // Close when clicking outside the header
        document.addEventListener('click', (e) => {
          if (!header.contains(e.target)) closeMenu();
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
        });

        // Close after choosing a link
        tabs.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
      });
  </script>
</body>
</html>
