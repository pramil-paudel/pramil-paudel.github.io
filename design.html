</head>
<body>

  <div class="wrap">
    <nav class="nav" aria-label="Primary">
      <div class="site-title">Pramil Paudel</div>
      <div class="tabs">
        <a class="tab" href="index.html">Home</a>
        <a class="tab" href="publications.html">Publications</a>
        <a class="tab" href="experience.html">Experience</a>
        <a class="tab" href="teachings.html">Teachings</a>
        <a class="tab" href="skills.html">Skills</a>
        <a class="tab" href="services.html">Services</a>
        <a class="tab" aria-current="page" href="design.html">Design Works</a>
        <a class="tab" href="education.html">Education</a>

    <div class="hero">

    <!-- Gallery -->
    <div class="band">
      <div class="inner">

          <div class="card">

            <!-- Filter bar -->
            <div class="filters" id="filters">

            </div>

            <div class="gallery-grid" id="gallery" role="list">
              <!-- Tag with data-tags="ui web poster identity" as needed. Reuse existing files to avoid 404s. -->
              <a class="tile wide" href="images/design_one.jpg" data-caption="Dashboard concept" data-tags="ui web" role="listitem" tabindex="0">
                <img class="shot" src="images/design_one.jpg" alt="Dashboard concept" loading="lazy">
              </a>

              <a class="tile tall" href="images/design_two.jpg" data-caption="Event poster" data-tags="poster" role="listitem" tabindex="0">
                <img class="shot" src="images/design_two.jpg" alt="Event poster" loading="lazy">
              </a>

              <a class="tile" href="images/design_three.jpg" data-caption="Landing page mock" data-tags="web ui" role="listitem" tabindex="0">
                <img class="shot" src="images/design_three.jpg" alt="Landing page mock" loading="lazy">
              </a>

              <a class="tile wide" href="images/design_four.png" data-caption="Mobile UI — cards" data-tags="ui" role="listitem" tabindex="0">
                <img class="shot" src="images/design_four.png" alt="Mobile UI cards" loading="lazy">

              <a class="tile tall" href="images/design_five.jpg" data-caption="Logo / identity exploration" data-tags="identity" role="listitem" tabindex="0">
                <img class="shot" src="images/design_five.jpg" alt="Logo identity exploration" loading="lazy">

              <a class="tile" href="images/design_six.jpg" data-caption="Infographic concept" data-tags="poster web" role="listitem" tabindex="0">

                <img class="shot" src="images/design_seven.jpg" alt="Hero header artwork" loading="lazy">
              </a>

              <!-- tasteful duplicates to enrich the layout -->
              <a class="tile" href="images/design_one.jpg" data-caption="Dashboard — alt colorway" data-tags="ui web" role="listitem" tabindex="0">
                <img class="shot" src="images/design_one.jpg" alt="Dashboard alt colorway" loading="lazy">
              </a>

              <a class="tile tall" href="images/design_two.jpg" data-caption="Poster series — variant" data-tags="poster" role="listitem" tabindex="0">
                <img class="shot" src="images/design_two.jpg" alt="Poster variant" loading="lazy">
              </a>

              <a class="tile wide" href="images/design_four.png" data-caption="Mobile UI — dark mode" data-tags="ui" role="listitem" tabindex="0">
                <img class="shot" src="images/design_four.png" alt="Mobile UI dark mode" loading="lazy">

        </section>

    <footer>© 2025 Pramil Paudel</footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
      <img class="lb-img" id="lbImg" alt="">
      <button class="lb-btn lb-next" id="lbNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

  <!-- Filters + Lightbox JS -->
  <script>
    (function(){
      const gallery = document.getElementById('gallery');
      const items   = Array.from(gallery.querySelectorAll('.tile'));
      const filters = document.getElementById('filters');
      const lb      = document.getElementById('lightbox');
      const lbImg   = document.getElementById('lbImg');
      const lbCaption = document.getElementById('lbCaption');
      const btnPrev = document.getElementById('lbPrev');
      const btnNext = document.getElementById('lbNext');
      const btnClose= document.getElementById('lbClose');
      let visible   = items.slice();
      let idx = 0;

      // --- Filtering ---
      function setFilter(tag){
        visible = [];
        items.forEach(el => {
          const tags = (el.dataset.tags || '').split(/\s+/);
          const show = (tag === 'all') || tags.includes(tag);
          el.style.display = show ? '' : 'none';
          if (show) visible.push(el);
        });
      }
      filters.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filter]');
        if (!btn) return;
        filters.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed','false'));
        btn.setAttribute('aria-pressed','true');
        setFilter(btn.dataset.filter);
      });

      // --- Lightbox ---
      function open(i){
        if (!visible.length) return;
        idx = (i + visible.length) % visible.length;
        const a = visible[idx];
        lbImg.src = a.getAttribute('href');
        lbImg.alt = a.querySelector('.shot')?.alt || '';
        const n = idx + 1, total = visible.length;
        const cap = a.dataset.caption || '';
        lbCaption.textContent = `${cap}  —  ${n}/${total}`;
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
        // preload neighbors
        const preL = new Image(); preL.src = visible[(idx-1+total)%total].getAttribute('href');
        const preR = new Image(); preR.src = visible[(idx+1)%total].getAttribute('href');
      }
      function close(){ lb.hidden = true; document.body.style.overflow = ''; lbImg.src = '' }
      function prev(){ open(idx-1) }
      function next(){ open(idx+1) }

      items.forEach((a, i) => {
        a.addEventListener('click', e => { e.preventDefault(); open(i) });
        a.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i) }
        });
      });
      btnPrev.addEventListener('click', prev);
      btnNext.addEventListener('click', next);
      btnClose.addEventListener('click', close);
      lb.addEventListener('click', e => { if (e.target === lb) close() });
      document.addEventListener('keydown', e => {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      });

      // default filter
      setFilter('all');
    })();
  </script>
</body>
</html>
