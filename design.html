  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Page-specific styles: gallery + lightbox -->
  <style>
    .gallery-grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap:18px;
    }
    .tile{
      position:relative;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--surface);
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .tile:hover{
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(11,99,206,.14);
    }
    .shot{
      width:100%;
      height:100%;
      display:block;
      aspect-ratio: 1/1;              /* default square; overridden by variants below */
      object-fit:cover;
      object-position: 50% 20%;
      background:#f4f6f8;
    }
    .tile.wide .shot{ aspect-ratio: 16/9; }
    .tile.tall .shot{ aspect-ratio: 3/4; }

    .caption{
      position:absolute; left:10px; bottom:10px;
      background: rgba(16,18,22,.55);
      color:#fff; padding:6px 10px; border-radius:10px;
      font-size:.92rem; letter-spacing:.1px;
      backdrop-filter: blur(4px);
    }

    /* Lightbox */
    .lightbox[hidden]{ display:none !important; }
    .lightbox{
      position:fixed; inset:0; z-index:9999;
      background: rgba(0,0,0,.78);
      display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .lb-inner{ position:relative; max-width:92vw; max-height:86vh }
    .lb-img{
      max-width:92vw; max-height:86vh; width:auto; height:auto;
      border-radius:14px; border:1px solid rgba(255,255,255,.25);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      display:block;
    }
    .lb-caption{
      color:#fff; text-align:center; margin-top:10px; opacity:.9;
      font-size:.98rem;
    }
    .lb-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.35); color:#fff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .lb-btn:hover{ background: rgba(0,0,0,.55); transform: translateY(-50%) scale(1.04) }
    .lb-prev{ left:-56px }
    .lb-next{ right:-56px }
    .lb-close{
      position:absolute; top:-54px; right:0;
      width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.35); color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    @media (max-width: 820px){
      .lb-prev{ left:8px }
      .lb-next{ right:8px }
      .lb-close{ top:-48px; right:8px }
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="wrap">
    <nav class="nav" aria-label="Primary">
      <div class="site-title">Pramil Paudel</div>
      <div class="tabs">
        <a class="tab" href="index.html">Home</a>

        <a class="tab" aria-current="page" href="design.html">Design Works</a>
        <a class="tab" href="education.html">Education</a>
        </div>
    </nav>

    <div class="hero">

        <div>

              <a class="tile tall"   href="images/design_five.jpg" data-caption="Visual identity">

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
      <img class="lb-img" id="lbImg" alt="">
      <button class="lb-btn lb-next" id="lbNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

  <!-- Tiny vanilla JS lightbox -->
  <script>
    (function(){
      const items = Array.from(document.querySelectorAll('#gallery .tile'));
      const lb   = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbCaption = document.getElementById('lbCaption');
      const btnPrev = document.getElementById('lbPrev');
      const btnNext = document.getElementById('lbNext');
      const btnClose = document.getElementById('lbClose');
      let idx = 0;

      function open(i){
        idx = i;
        const a = items[idx];
        lbImg.src = a.getAttribute('href');
        lbImg.alt = a.querySelector('.shot')?.alt || '';
        lbCaption.textContent = a.dataset.caption || '';
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
      }
      function close(){
        lb.hidden = true;
        document.body.style.overflow = '';
        lbImg.src = '';
      }
      function prev(){ open((idx - 1 + items.length) % items.length); }
      function next(){ open((idx + 1) % items.length); }

      items.forEach((a, i) => {
        a.addEventListener('click', (e) => { e.preventDefault(); open(i); });
      });
      btnPrev.addEventListener('click', prev);
      btnNext.addEventListener('click', next);
      btnClose.addEventListener('click', close);

      lb.addEventListener('click', (e) => {
        if (e.target === lb) close();  // click outside image closes
      });

      document.addEventListener('keydown', (e) => {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      });
    })();
  </script>
</body>
</html>
