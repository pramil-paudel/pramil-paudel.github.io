  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
</head>

<body>
  <!-- Subtle Tile Background -->
  <div class="page-bg" aria-hidden="true"></div>

  <!-- Shared Header -->
  <div id="header"></div>

  <!-- Main Content -->
  <div class="wrap">

    <!-- Education Section -->
    <div class="band">
      <div class="inner">

          <div class="card">

    <!-- Footer -->

  <!-- Header Loader -->
  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
      })
      .then(() => {
        // Mobile menu toggle logic
        document.addEventListener('click', e => {
          if (e.target.matches('.nav-toggle')) {
            e.target.classList.toggle('active');
            document.getElementById('primary-tabs').classList.toggle('show');
          }
        });
      });
  </script>
