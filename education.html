<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Education — Pramil Paudel</title>
  <meta name="description" content="Education of Pramil Paudel." />
  <link rel="icon" href="favicon.ico" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
</head>

<body>
  <!-- Subtle Tile Background -->
  <div class="page-bg" aria-hidden="true"></div>

  <!-- Shared Header -->
  <div id="header"></div>

  <!-- Main Content -->
  <div class="wrap">

    <!-- Education Section -->
    <div class="band">
      <div class="inner">
        <section>
          <div class="card">
            <h2>Degrees</h2>
            <ul class="clean">
              <li><strong>PhD in Computer Science</strong>, University of Kansas (2020–Present)</li>
              <li><strong>BE in Electronics & Communication Engineering</strong>, Tribhuvan University (2011–2014)</li>
            </ul>
          </div>
        </section>
      </div>
    </div>

    <!-- Add more sections if needed -->

    <!-- Footer -->

  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        const mount = document.getElementById("header");
        mount.innerHTML = html;

        // Scope to the inserted header to avoid collisions
        const header = mount.querySelector('.site-header');
        const toggle = header?.querySelector('.nav-toggle');
        const tabs   = header?.querySelector('#primary-tabs');

        if (!toggle || !tabs) return;

        // Ensure ARIA is present
        toggle.setAttribute('type', 'button');
        toggle.setAttribute('aria-controls', 'primary-tabs');
        toggle.setAttribute('aria-expanded', 'false');

        // Use a single class name that your CSS recognizes
        const openMenu  = () => { tabs.classList.add('open');  toggle.setAttribute('aria-expanded','true');  };
        const closeMenu = () => { tabs.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); };

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = tabs.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(isOpen));
        });

        // Close when clicking outside the header
        document.addEventListener('click', (e) => {
          if (!header.contains(e.target)) closeMenu();
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
        });

        // Close after choosing a link
        tabs.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
      });
  </script>
</body>
